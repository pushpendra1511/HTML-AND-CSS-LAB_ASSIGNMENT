<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>units</title>
    <style>
        .pixelbox {
            width: 200px;
            height: 40px;
            background-color: lightblue;
            margin-bottom: 20px;
        }
        .percentbox {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
            margin-bottom: 20px;
        }
        .remtext {
            font-size: 1.5rem;
            
        }
    </style>
</head>
<body>
    <div class="pixelbox">fixed pixel layout box(200px)</div>
    <div class="percentbox">relative percentage layout box(50%)</div>
    <p class="remtext">this paragraph scale sizing parameter leverage fluid root REM calculation.</p>
</body>
</html>
