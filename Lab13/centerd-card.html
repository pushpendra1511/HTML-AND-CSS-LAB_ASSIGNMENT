<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Product Array Grid</title>
    <style>
        .row{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ded8d8;
            gap: 15px;
            
        }
        .card{
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 140px;
            
            
        }
        
    </style>
</head>
<body>
    <div class="row">
        <div class="card">
            <h3>Starter</h3>
            <p>price: 199</p>
        </div>
        <div class="card">
            <h3>Standard</h3>
            <p>price: 349</p>
        </div>
        <div class="card">
            <h3>Premium</h3>
            <p>price: 499</p>
        </div>
    </div>
</body>
</html>
