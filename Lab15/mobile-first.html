<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile First Engineering Layout</title>
    <style>
        .cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #fff2e6;
            border: 1px solid #ffcc99;
            padding: 20px;
        }
        @media (min-width: 600px) {
            .cards {
                flex-direction: row;
            }
            .card {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="cards">
        <div class="card">
            <h2>Primary Unit Node</h2>
            <p>This layout card blocks align vertically on small screens and switch to rows on desktops.</p>
        </div>
        <div class="card">
            <h2>Secondary Unit Node</h2>
            <p>This layout card blocks align vertically on small screens and switch to rows on desktops.</p>
        </div>
    </div>
</body>
</html>
