<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Text Resolution Media Queries</title>
    <style>
        body {
            font-size: 1rem;
            font-family: sans-serif;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
        }
        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>Adaptive Scaling Headline Display</h1>
    <p>This tracking text line adjusts its dimensions based on view frame constraints.</p>
</body>
</html>
