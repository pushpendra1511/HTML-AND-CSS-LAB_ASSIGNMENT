<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Portal</title>
</head>
<body>
    <h1>Account Registration</h1>
    <from method="post" action="thanks.html" >
        <div>
            <label for="Fullname" >Full Name:</label>
            <input type="text" id="Fullname" name="fullname" placeholder="Enter your name">
        </div>
        <div>
            <label for="email" >Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email">
        </div>
        <div>
            <label for="password" >Password:</label>
            <input type="password" id="password" name="password" placeholder="Enert your Password">
        </div>

        <div>
            <button type="submit" >Sign Up</button>
        </div>
        
        
    </from>
    
</body>
</html>
